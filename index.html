<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetX – Money Tracker</title>
    <script>
      // Apply appearance before first paint to prevent FOUC.
      // The values live in src/styles/tokens.css; this only writes the four
      // data attributes the stylesheet keys off. Keep the try/catch —
      // localStorage throws in some privacy modes.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('budgetku_state') || '{}');
          var r = document.documentElement;
          r.setAttribute('data-theme', s.darkMode ? 'dark' : 'light');
          r.setAttribute('data-density', s.density || 'standard');
          r.setAttribute('data-radius', s.radius || 'soft');
          if (s.collapsed) r.setAttribute('data-collapsed', 'true');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
